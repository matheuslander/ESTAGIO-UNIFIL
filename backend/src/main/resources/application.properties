spring.application.name=unicontrol

# Variaveis de ambiente devem ser usadas fora do ambiente local. Os fallbacks
# abaixo preservam a configuracao usada na demonstracao academica.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estoque_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:33273288Mm.}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8080}

# A sessao HTTP identifica o usuario no backend; o cookie nunca fica acessivel
# ao JavaScript. Em HTTPS, defina SESSION_COOKIE_SECURE=true.
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
unicontrol.uploads.usuarios-dir=${UNICONTROL_USER_PHOTO_DIR:uploads/usuarios}

# Dados exclusivamente de desenvolvimento/teste. Desabilite com
# UNICONTROL_DEV_DATA_ENABLED=false em outros ambientes.
unicontrol.dev-data.enabled=${UNICONTROL_DEV_DATA_ENABLED:true}
unicontrol.dev-data.admin.login=${UNICONTROL_DEV_ADMIN_LOGIN:admin}
unicontrol.dev-data.admin.password=${UNICONTROL_DEV_ADMIN_PASSWORD:admin123}
unicontrol.dev-data.user.login=${UNICONTROL_DEV_USER_LOGIN:usuario}
unicontrol.dev-data.user.password=${UNICONTROL_DEV_USER_PASSWORD:usuario123}
